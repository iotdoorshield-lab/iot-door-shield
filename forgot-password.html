<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - Smart Security</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
        }
        
        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .title {
            color: #333;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 40px;
            font-size: 16px;
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        .input-label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .input-field {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .reset-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            width: 100%;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
        }
        
        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            display: none;
            border: 1px solid #c3e6cb;
        }
        
        .demo-info {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 30px;
            border-left: 4px solid #667eea;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #888;
            font-size: 14px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="login.html" class="back-link">← Back to Login</a>
        
        <h1 class="title">Reset Your Password</h1>
        <p class="subtitle">Enter your email to receive password reset instructions</p>
        
        <form id="resetForm">
            <div class="input-group">
                <label class="input-label">Email Address</label>
                <input type="email" class="input-field" id="email" 
                       placeholder="Enter your registered email" required>
            </div>
            
            <button type="button" class="reset-btn" onclick="resetPassword()">
                Send Reset Link
            </button>
            
            <div class="success-msg" id="successMsg">
                ✓ Reset link sent to your email! Check your inbox.
            </div>
            
            <div class="demo-info">
                <strong>Note:</strong> This is a demo system.<br>
                In real system, reset link would be sent to your email.
            </div>
        </form>
        
        <div class="footer">
            Smart Security System © 2024
        </div>
    </div>

    <script>
        function resetPassword() {
            const email = document.getElementById('email').value;
            
            // Simple validation
            if (!email || !email.includes('@')) {
                alert('Please enter a valid email address.');
                return;
            }
            
            // Show success message
            const btn = document.querySelector('.reset-btn');
            btn.innerHTML = '✓ LINK SENT';
            btn.style.background = 'linear-gradient(135deg, #4CAF50 0%, #45a049 100%)';
            btn.disabled = true;
            
            document.getElementById('successMsg').style.display = 'block';
            
            // Show alert
            setTimeout(() => {
                alert(`Password reset link sent to: ${email}\n(Note: This is a demo. No actual email will be sent.)`);
            }, 500);
        }
        
        // Enter key support
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                resetPassword();
            }
        });
        
        // Auto-fill demo email
        window.onload = function() {
            document.getElementById('email').value = 'admin@smartsecurity.com';
        }
    </script>
</body>
</html>
